
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EnergiaMap RN | Energias Renováveis</title>

    <!-- Biblioteca Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <!-- Estilos da aplicação -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>EnergiaMap RN</h1>
        <p>Explorando referências em energias renováveis no Rio Grande do Norte!</p>
    </header>

    <main>
        <section class="map-section">
            <div class="section-heading">
    <h2>Mapa de Energias Renováveis</h2>
    <p>Visualize os pontos de referência no território potiguar.</p>
</div>

<div class="filters">
    <h3>Filtrar por tipo de energia:</h3>

    <label>
        <input
            type="checkbox"
            class="filtro-energia"
            value="Energia Solar"
            checked
        >
        Energia Solar
    </label>

    <label>
        <input
            type="checkbox"
            class="filtro-energia"
            value="Energia Eólica"
            checked
        >
        Energia Eólica
    </label>
</div>

<div class="map-legend">
    <span class="legend-title">Legenda:</span>

    <span class="legend-item">
        <span class="legend-color solar"></span>
        Energia Solar
    </span>

    <span class="legend-item">
        <span class="legend-color eolica"></span>
        Energia Eólica
    </span>
</div>

<div id="map"></div>
        </section>
    </main>

    <footer>
        <p>EnergiaMap RN | Projeto demonstrativo</p>
    </footer>

    <!-- Biblioteca Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- JavaScript da aplicação -->
    <script src="js/script.js"></script>

</body>
</html>
